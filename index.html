<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 { text-align: center; color: #333; }
        .input-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; color: #666; }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        #result {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>BMI Calculator</h2>
        <div class="input-group">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="ဥදා: 65">
        </div>
        <div class="input-group">
            <label for="height">Height (cm):</label>
            <input type="number" id="height" placeholder="ဥදා: 170">
        </div>
        <button onclick="calculateBMI()">Calculate BMI</button>
        <div id="result"></div>
    </div>

    <script>
    function calculateBMI() {
    // බර (kg) සහ උස (cm) ලබා ගැනීම
    const weight = document.getElementById('weight').value;
    const heightCm = document.getElementById('height').value;
    const resultDiv = document.getElementById('result');

    // අගයන් නිවැරදිව දීලා තියෙනවද බැලීම
    if (weight === '' || heightCm === '' || weight <= 0 || heightCm <= 0) {
        resultDiv.style.color = 'red';
        resultDiv.innerHTML = "කරුණාකර సరైన අගයන් ඇතුළත් කරන්න!";
        return;
    }

    // උස සෙන්ටිමීටර වලින් මීටර වලට හැරවීම (උදා: 170cm -> 1.7m)
    const heightM = heightCm / 100;

    // BMI සූත්‍රය: බර / (උස වර්ගය)
    const bmi = (weight / (heightM * heightM)).toFixed(1);

    // සෞඛ්‍ය තත්ත්වය තීරණය කිරීම
    let status = "";
    let color = "";

    if (bmi < 18.5) {
        status = "কম බර (Underweight)";
        color = "orange";
    } else if (bmi >= 18.5 && bmi <= 24.9) {
        status = "සාමාන්‍ය බර (Normal weight)";
        color = "green";
    } else if (bmi >= 25 && bmi.toFixed(1) <= 29.9) {
        status = "අධික බර (Overweight)";
        color = "peru";
    } else {
        status = "স্থূলභාවය / අධික ස්ථූලතාව (Obese)";
        color = "red";
    }

    // ප්‍රතිඵලය screen එකේ පෙන්වීම
    resultDiv.style.color = color;
    resultDiv.innerHTML = `Your BMI: ${bmi}<br>Status: ${status}`;
}
    </script>

</body>
</html>
